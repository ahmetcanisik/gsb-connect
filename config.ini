; This is only a format reference. The application does NOT read this file.
; At runtime it reads/writes a per-user config instead:
;   Windows:        %APPDATA%\GSBConnect\config.ini
;   Linux / macOS:  ~/.gsbconnect/config.ini
;
; On Windows the saved values are encrypted with DPAPI and marked ENCRYPTED = 1.
; Never commit real credentials to this file.
[Credentials]
TC_KIMLIK = PUT_YOUR_TC_HERE
SIFRE = PUT_YOUR_PASSWORD_HERE

; Non-secret preferences. LANGUAGE is the interface language: tr (Turkish,
; the default) or en (English). AUTOSTART (0/1) mirrors the "Start with Windows"
; toggle. Both are written automatically; the registry Run key is the source of
; truth for AUTOSTART at startup.
[Settings]
LANGUAGE = tr
AUTOSTART = 0
