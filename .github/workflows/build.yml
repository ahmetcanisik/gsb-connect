name: build

# Builds GSB Connect for Windows, Linux and Android, gated behind security
# checks. Runs ONLY when `main` is updated (per project policy); `dev` and PRs
# never trigger it. `workflow_dispatch` is kept so a build can be run manually.
#
# This workflow does not publish anything: each platform uploads its bundles as
# artifacts. The separate `release` workflow runs via `workflow_run` ONLY when
# this workflow finishes successfully, downloads those artifacts and publishes
# the GitHub Release. So a failed build (or a failed security check) means no
# release is ever cut.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- Security gate: if this fails, no build job runs and no release is cut ----
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # gitleaks needs full history to scan it
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - name: JS dependency audit
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust dependency audit (cargo-audit)
        run: |
          cargo install cargo-audit --locked
          cargo audit
        working-directory: src-tauri   # Cargo.lock lives here

  # ---- Windows: NSIS + MSI ----
  build-windows:
    needs: security
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        with:
          args: "--bundles nsis,msi"   # no release inputs => build only
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # ---- Linux: deb + AppImage ----
  build-linux:
    needs: security
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf \
            build-essential file libssl-dev
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        with:
          args: "--bundles deb,appimage"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ---- Android: build an unsigned release APK, then sign it with a keystore
  #      generated inside the job. The signing key is ephemeral (new per build),
  #      so the APK installs but cannot be updated in place across versions.
  #      For stable signing, store a keystore in repository secrets instead. ----
  build-android:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          # The `env` context can't read the runner's OS-level ANDROID_NDK_ROOT,
          # so export the concrete NDK path for the later tauri steps.
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install
      - name: Generate Android platform project
        run: npm run tauri android init
      - name: Apply app icon to the Android project
        # init writes the project under src-tauri/gen/android; regenerate the
        # launcher mipmaps there from the source SVG so the APK uses our icon.
        run: npm run tauri icon app-icon.svg
      - name: Build APK (unsigned release)
        run: npm run tauri android build -- --apk
      - name: Generate keystore and sign the APK
        run: |
          set -e
          KS="$RUNNER_TEMP/release.jks"
          PW="$(openssl rand -base64 24)"
          keytool -genkeypair -v -keystore "$KS" -alias gsbconnect \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=GSB Connect, O=GSB Connect Project, C=TR"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="$(find src-tauri/gen/android -path '*release*' -name '*-unsigned.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "No unsigned release APK found under src-tauri/gen/android" >&2
            find src-tauri/gen/android -name '*.apk' >&2 || true
            exit 1
          fi
          echo "Signing $APK"
          "$BT/zipalign" -p -f 4 "$APK" app-aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:"$PW" \
            --out gsb-connect.apk app-aligned.apk
          "$BT/apksigner" verify gsb-connect.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: gsb-connect.apk
          if-no-files-found: error
