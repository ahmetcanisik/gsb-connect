name: release

# Publishes the GSB Connect GitHub Release.
#
# Trigger policy (per project requirements):
#   - Runs ONLY after the `build` workflow finishes SUCCESSFULLY on `main`
#     (see the `workflow_run` trigger + the `conclusion == 'success'` guard).
#   - It never builds anything itself: it downloads the artifacts produced by
#     the triggering build run and attaches them to the Release. This guarantees
#     the release contains exactly the binaries that passed the build and the
#     security checks; if any build/security job failed, this workflow's `if`
#     condition is false and nothing is published.
#
# NOTE: a `workflow_run`-triggered workflow always runs the copy of this file
# that lives on the default branch (`main`). Both this file and `build.yml` must
# be merged into `main` before any release can fire.
#
# The release tag/name come from the `version` field in src-tauri/tauri.conf.json.
# Bump that version (and package.json / Cargo.toml) to cut a new release; pushing
# to main without a bump updates the same tag/release.

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
    branches: [main]

permissions:
  contents: write     # to create the Release
  actions: read       # to download artifacts from the triggering build run

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Read version
        id: ver
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: GSB Connect v${{ steps.ver.outputs.version }}
          body: >
            Windows (NSIS/MSI), Linux (deb/AppImage) and Android (APK) builds.
            Unsigned freeware: on Windows SmartScreen may warn on first run
            (More info -> Run anyway). The Android APK is signed with a
            CI-generated key, so updating across versions may require a reinstall.
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
