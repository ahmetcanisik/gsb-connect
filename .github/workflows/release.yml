name: release

# Build the GSB Connect Windows installer with the Tauri bundler and publish it
# to a GitHub Release.
#
# Trigger policy (per project requirements):
#   - Runs ONLY when the `main` branch is updated (push to main).
#   - Never runs for pushes to `dev` or any other branch, and not for PRs.
#   - `workflow_dispatch` is kept so a release can also be triggered manually.
#
# The release tag/name come from the `version` field in src-tauri/tauri.conf.json
# (tauri-action substitutes __VERSION__). Bump that version to cut a new release;
# pushing to main without a bump re-uses the same tag/release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "GSB Connect v__VERSION__"
          releaseBody: >
            Windows installer for GSB Connect. Installs to Program Files with a
            Start Menu shortcut; no credentials are bundled. Unsigned freeware:
            SmartScreen may warn on first run (More info -> Run anyway).
          releaseDraft: false
          prerelease: false
          args: "--bundles nsis,msi"

# Android (future): building a release APK/AAB needs an Android SDK/NDK + a
# signing keystore stored in repository secrets. When that is ready, add a
# separate `workflow_dispatch`-only job here (so the main-only rule is kept)
# that runs `tauri android build` and uploads the signed artifact.
