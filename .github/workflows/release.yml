name: release

# Build the Windows installer and publish it to a GitHub Release.
#
# Triggers on a version tag (e.g. v1.0.0). The installer is compiled in the
# cloud with Inno Setup, renamed to gsb-connect-setup.exe, and attached to the
# Release for that tag. Uses only the official actions/checkout action and tools
# preinstalled on the windows-latest runner (Rust, Chocolatey, gh CLI).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\setup.iss'

      - name: Stage setup asset
        run: Copy-Item installer\dist\*.exe gsb-connect-setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME" gsb-connect-setup.exe
          --title "GSB Connect $env:GITHUB_REF_NAME"
          --notes "Windows installer for GSB Connect $env:GITHUB_REF_NAME. Installs gsb-connect.exe to Program Files with a Start Menu shortcut; no credentials are bundled. Unsigned freeware: SmartScreen may warn on first run."
