[package]
name = "gsb-connect"
version = "1.0.0"
edition = "2021"
description = "Login automation tool for the GSB WiFi captive portal with optional Cloudflare WARP support"
license = "MIT"
build = "build.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
eframe = "0.31"

# Windows-only: minimal raw Win32 bindings. Used by `secret_store` for the DPAPI
# credential encryption and by `autostart` for the per-user "Run" registry key.
# Only the features actually called are enabled to keep the dependency
# lightweight (the heavy `windows` crate is intentionally avoided).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
] }

# Windows-only build dependency: embeds version info and an optional icon into
# the release executable (see build.rs). Not required for the app to function.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
